[tool.poetry]
name = "nokia-snake-classic"
version = "2.0.0"
description = "Nokia 3310 Classic Snake Enterprise Platform"
authors = ["TrainPlex Studio <dev@trainplex.local>"]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0.6"
pillow = "^10.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-django = "^4.8.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

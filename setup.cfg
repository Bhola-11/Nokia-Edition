[metadata]
name = nokia-snake-classic
version = 2.0.0
description = Enterprise Nokia 3310 Snake Platform with Django MVT and Canvas Engine

[tool:pytest]
DJANGO_SETTINGS_MODULE = nokia_snake.settings

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */manage.py
    */wsgi.py
    */asgi.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:

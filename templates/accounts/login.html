{% extends 'base.html' %}

{% block title %}Login — Nokia 3310 Snake{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 40px auto;">
    <div class="retro-card">
        <h2 style="font-family: 'Press Start 2P', monospace; font-size: 16px; color: var(--accent-cyan); margin: 0 0 16px; text-align: center;">📱 LOGIN</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 14px;">
                <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Gamer Tag</label>
                {{ form.username }}
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Password / PIN</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-retro btn-retro-green" style="width: 100%; justify-content: center; padding: 10px;">
                Slide In (Login)
            </button>
        </form>

        <div style="text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted);">
            Don't have a Nokia Gamer Tag? <a href="{% url 'accounts:register' %}" style="color: var(--accent-cyan);">Register Here</a>
        </div>
    </div>
</div>
{% endblock %}
